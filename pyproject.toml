[project]
name = "student-helper"
version = "0.1.0"
description = "BUAA academic score and recommendation GPA workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<1",
  "uvicorn[standard]>=0.51,<1",
  "pydantic>=2.12,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
